{{- if .pages }}
<ul class="ah-updates">
  {{- range .pages }}
  <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time><a href="{{ .RelPermalink }}">{{ .Params.update_title | default .Title }}</a></li>
  {{- end }}
</ul>
{{- else }}<p class="ah-meta">{{ .empty }}</p>{{ end }}
